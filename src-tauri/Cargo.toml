[package]
name = "opencohost_tauri_shell"
version = "0.0.0"
description = "OpenCohost Tauri shell prototype"
authors = ["OpenCohost"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
