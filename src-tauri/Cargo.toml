[package]
name = "opencohost_tauri_shell"
version = "0.0.0"
description = "OpenCohost Tauri shell prototype"
authors = ["OpenCohost"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native open-file dialog. The webview's <input type=file> hands back a
# sandboxed File object with no filesystem path, and both POST
# /api/music/import and PUT /api/avatar/config take an absolute server-side
# path — so a real OS picker is the only thing that can feed them.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry"] }
