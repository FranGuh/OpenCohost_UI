<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCohost</title>
    <link rel="icon" type="image/png" href="/brand/opencohost.png" />
    <style>
      /* Kill the white boot flash: paint the darkest brand ground (--void /
         --background from tokens.css, cockpit default) on the very first frame,
         BEFORE the CSS bundle loads. Literal hex is required — CSS vars aren't
         defined yet at this point. Keep in sync with tokens.css --void. */
      html,
      body {
        margin: 0;
        background-color: #05070b;
      }
      /* Static, branded first paint. Lives inside #root so React replaces it the
         instant it mounts (BootLoader takes over) — no lingering extra loader. */
      #oc-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #05070b;
      }
    </style>
    <script>
      // Blocking pre-paint theme apply — avoids a flash of the :root
      // (cockpit/dark) default on reload for studio/aurora users, since
      // useTheme.ts only sets data-theme in a post-paint useEffect.
      // Keep this key/set/default in sync with src/theme/useTheme.ts.
      (function () {
        var STORAGE_KEY = "oc-theme";
        var THEME_NAMES = ["cockpit", "aurora", "studio"];
        var DEFAULT_THEME = "cockpit";
        var stored = null;
        try {
          stored = window.localStorage.getItem(STORAGE_KEY);
        } catch (e) {
          stored = null;
        }
        var theme = THEME_NAMES.indexOf(stored) !== -1 ? stored : DEFAULT_THEME;
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- First-frame branded splash (BrandMark motif, hardcoded colors — no
           bundle/CSS dependency). React unmounts it on mount and BootLoader
           takes over as the single loader. -->
      <div id="oc-boot-splash">
        <svg width="76" height="76" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="50" cy="66" r="34" stroke="#e8f1ec" stroke-width="15" fill="none" opacity="0.85" />
          <circle cx="90" cy="34" r="20" fill="#5ad7e6" stroke="#05070b" stroke-width="3" />
          <rect x="83" y="27" width="6" height="12" rx="3" fill="#e8f1ec" />
          <rect x="93" y="27" width="6" height="12" rx="3" fill="#e8f1ec" />
          <rect x="87" y="41" width="5" height="5" rx="2.5" fill="#e8f1ec" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
